{% load static %}
<!-- Sidebar Filters (Feature 15) -->

<style>
    /* Force Bright Theme for Sidebar */
    .filter-card-luxe {
        background: #ffffff !important;
        color: #1a1a1a !important;
        border-radius: 30px !important;
        padding: 20px 25px 35px !important;
        box-shadow: 0 20px 50px rgba(0,0,0,0.1) !important;
        border: 1px solid rgba(0,0,0,0.05) !important;
        position: relative !important;
        overflow: hidden !important;
    }
    
    .filter-card-luxe * {
        color: inherit !important;
    }

    .filter-card-luxe h6 {
        color: #1a1a1a !important;
        font-weight: 800 !important;
        letter-spacing: 1px !important;
    }

    .filter-group {
        background: #ffffff !important;
        border-radius: 20px !important;
        padding: 20px !important;
        margin-bottom: 25px !important;
        border: 1px solid #f0f0f0 !important;
        box-shadow: 0 5px 15px rgba(0,0,0,0.02) !important;
    }

    .filter-scroll-area {
        background: #ffffff !important;
        padding: 10px !important;
        border-radius: 15px !important;
        border: 1px solid #f8f9fa !important;
        max-height: 250px !important;
        overflow-y: auto !important;
        /* Hide scrollbar for this area */
        scrollbar-width: none !important;
        -ms-overflow-style: none !important;
    }

    .filter-scroll-area::-webkit-scrollbar {
        display: none !important;
        width: 0 !important;
    }

    .filter-group .form-label {
        color: #1a1a1a !important;
        font-weight: 800 !important;
        text-transform: uppercase !important;
        letter-spacing: 1px !important;
    }

    .clear-all-link {
        color: #ec4899 !important;
        background: rgba(236,72,153,0.1) !important;
        padding: 4px 12px !important;
        border-radius: 20px !important;
        font-size: 0.8rem !important;
    }

    .luxe-check {
        margin-bottom: 10px !important;
        padding: 8px 12px !important;
        border-radius: 10px !important;
        transition: all 0.3s ease !important;
    }

    .luxe-check:hover {
        background: #f8f9fa !important;
        transform: translateX(5px) !important;
    }

    .luxe-check .form-check-label {
        color: #444 !important;
        font-weight: 600 !important;
    }

    /* Colorful Hover for Categories */
    .luxe-check:nth-child(odd):hover .form-check-label { color: #ec4899 !important; }
    .luxe-check:nth-child(even):hover .form-check-label { color: #6366f1 !important; }
    .luxe-check:nth-child(3n):hover .form-check-label { color: #10b981 !important; }

    .search-input-luxe {
        background: white !important;
        border: 2px solid #eee !important;
        border-radius: 12px !important;
    }

    .search-input-luxe .form-control {
        background: white !important;
        color: #1a1a1a !important;
    }

    /* Colorful Icons */
    .filter-group:nth-of-type(1) i { color: #6366f1 !important; }
    .filter-group:nth-of-type(2) i { color: #ec4899 !important; }
    .filter-group:nth-of-type(3) i { color: #d4a574 !important; }
    .filter-group:nth-of-type(4) i { color: #10b981 !important; }

    /* Fix for the screenshot's dark look */
    [data-theme="dark"] .filter-card-luxe {
        background: #ffffff !important;
    }

    [data-theme="dark"] .filter-card-luxe * {
        color: #1a1a1a !important; /* Keep text dark in sidebar because it stays white */
    }

    /* Global Theme Contrast Improvements */
    [data-theme="dark"] h1, 
    [data-theme="dark"] h2, 
    [data-theme="dark"] h3, 
    [data-theme="dark"] h4, 
    [data-theme="dark"] h5, 
    [data-theme="dark"] h6,
    [data-theme="dark"] p,
    [data-theme="dark"] span {
        color: #f8fafc; /* Bright text for dark mode */
    }

    [data-theme="light"] h1, 
    [data-theme="light"] h2, 
    [data-theme="light"] h3, 
    [data-theme="light"] h4, 
    [data-theme="light"] h5, 
    [data-theme="light"] h6,
    [data-theme="light"] p,
    [data-theme="light"] span {
        color: #0f172a; /* Dark text for light mode */
    }
</style>

<div class="filter-sidebar filter-card-luxe">
    <form name="product_filters" id="filter-form" method="get" class="product-filter-form">
        <div class="filter-header-main">
            <h6 class="mb-0"><i class="bi bi-sliders2-vertical me-2"></i>BỘ LỌC TÌM KIẾM</h6>
            <a href="{% url 'product_list' %}" class="clear-all-link">Xóa hết</a>
        </div>

        <!-- Search -->
        <div class="filter-group">
            <label class="form-label"><i class="bi bi-search me-2"></i>Tìm kiếm</label>
            <div class="input-group search-input-luxe">
                <span class="input-group-text"><i class="bi bi-search"></i></span>
                <input type="text" name="query" value="{{ query }}" class="form-control"
                    placeholder="Tên, thương hiệu..." autocomplete="off">
            </div>
        </div>
        
        <!-- Sort Filter (Integrated into sidebar) -->
        <div class="filter-group">
            <label class="form-label"><i class="bi bi-sort-down me-2"></i>Sắp xếp theo</label>
            <select name="sort" id="sidebar-sort-select" class="form-select luxe-select border-0 bg-light rounded-pill px-3" onchange="this.form.submit()">
                <option value="newest" {% if selected_sort == 'newest' %}selected{% endif %}>Mới nhất</option>
                <option value="price_asc" {% if selected_sort == 'price_asc' %}selected{% endif %}>Giá: Thấp đến Cao</option>
                <option value="price_desc" {% if selected_sort == 'price_desc' %}selected{% endif %}>Giá: Cao đến Thấp</option>
                <option value="rating" {% if selected_sort == 'rating' %}selected{% endif %}>Đánh giá tốt nhất</option>
            </select>
        </div>

        <!-- Category Filter -->
        {% if categories %}
        <div class="filter-group">
            <label class="form-label"><i class="bi bi-grid-3x3-gap me-2"></i>Danh mục</label>
            <div class="filter-scroll-area luxe-scrollbar">
                {% for cat in categories %}
                <div class="form-check luxe-check">
                    <input class="form-check-input category-checkbox" type="checkbox" name="category"
                        value="{{ cat.id }}" id="cat{{ cat.id }}"
                        {% if cat.id|stringformat:"s" in selected_cat_ids %}checked{% endif %}>
                    <label class="form-check-label" for="cat{{ cat.id }}">
                        {{ cat.name }}
                    </label>
                </div>
                {% endfor %}
            </div>
        </div>
        {% endif %}

        <!-- Price Range Filter -->
        <div class="filter-group">
            <label class="form-label"><i class="bi bi-tags me-2"></i>Khoảng giá</label>
            <div id="price-slider" class="mt-3 luxe-slider"></div>
            <div class="d-flex justify-content-between align-items-center mt-3 price-display-wrapper">
                <span id="min-price-display">0₫</span>
                <span class="price-separator"></span>
                <span id="max-price-display">10.000.000₫</span>
            </div>
            <input type="hidden" name="min_price" id="min-price-input" value="{{ min_price|default:'' }}">
            <input type="hidden" name="max_price" id="max-price-input" value="{{ max_price|default:'' }}">
        </div>

        <!-- Brand Filter -->
        {% if brands %}
        <div class="filter-group">
            <label class="form-label"><i class="bi bi-patch-check me-2"></i>Thương hiệu</label>
            <div class="filter-scroll-area luxe-scrollbar">
                {% for brand in brands %}
                <div class="form-check luxe-check">
                    <input class="form-check-input brand-checkbox" type="checkbox" name="brand" value="{{ brand }}"
                        id="brand{{ forloop.counter }}" {% if brand in selected_brand_names %}checked{% endif %}>
                    <label class="form-check-label" for="brand{{ forloop.counter }}">
                        {{ brand }}
                    </label>
                </div>
                {% endfor %}
            </div>
        </div>
        {% endif %}

        <!-- Scent Type Filter -->
        {% if scent_types %}
        <div class="filter-group">
            <label class="form-label"><i class="bi bi-wind me-2"></i>Loại hương</label>
            <div class="filter-scroll-area luxe-scrollbar">
                {% for scent in scent_types %}
                <div class="form-check luxe-check">
                    <input class="form-check-input scent-checkbox" type="checkbox" name="scent_type" value="{{ scent }}"
                        id="scent{{ forloop.counter }}" {% if scent in selected_scent_names %}checked{% endif %}>
                    <label class="form-check-label" for="scent{{ forloop.counter }}">
                        {{ scent }}
                    </label>
                </div>
                {% endfor %}
            </div>
        </div>
        {% endif %}



        <!-- Action Buttons -->
        <div class="filter-actions mt-4">
            <button type="submit" class="btn btn-primary w-100 apply-btn-luxe">
                <i class="bi bi-check2-circle me-2"></i>ÁP DỤNG BỘ LỌC
            </button>
        </div>
    </form>
</div>
